<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Seller Blacklist — Paws Delivered Admin</title>
  <style>
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.875rem; color: #666; margin-bottom: 2rem; }
    .add-row { display: flex; gap: 0.5rem; }
    .add-row input { flex: 1; padding: 0.55rem 0.75rem; border: 1.5px solid #ddd; border-radius: 6px; font-size: 0.9rem; font-family: inherit; }
    .add-row input:focus { outline: none; border-color: #2C5F8A; }
    .admin-btn-remove { background: #fee2e2; color: #b91c1c; font-size: 0.8rem; padding: 0.3rem 0.75rem; }
    .admin-btn-remove:hover { background: #fecaca; }
  </style>
  <script src="/admin/admin.js"></script>
</head>
<body>
  <div class="admin-container">
    <h1>Seller Blacklist</h1>
    <p class="subtitle">Listings from blacklisted PBT sellers are hidden and will be marked ended on the next sync.</p>
    <div id="content"><div class="admin-card"><p class="admin-muted">Loading…</p></div></div>
  </div>

  <script>
    async function addSeller() {
      const input = document.getElementById('usernameInput');
      const username = input.value.trim().toLowerCase();
      const msgEl = document.getElementById('addMsg');
      if (!username) { showMsg(msgEl, 'Enter a username.', false); return; }
      const res = await adminFetch('/api/admin/seller-blacklist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username }),
      });
      const data = await res.json();
      if (res.ok) {
        showMsg(msgEl, `Added "${data.username}". Their listings are now ended.`, true);
        input.value = '';
        renderList();
      } else {
        showMsg(msgEl, data.error || 'Failed.', false);
      }
    }

    async function removeSeller(username) {
      if (!confirm(`Remove "${username}" from blacklist? Their listings won't be restored automatically — they'll reappear on the next sync if still on PBT.`)) return;
      const res = await adminFetch(`/api/admin/seller-blacklist/${encodeURIComponent(username)}`, { method: 'DELETE' });
      if (res.ok) renderList();
    }

    function showMsg(el, text, ok) {
      el.className = 'admin-msg ' + (ok ? 'admin-msg-ok' : 'admin-msg-err');
      el.textContent = text;
      setTimeout(() => { el.textContent = ''; el.className = ''; }, 4000);
    }

    async function renderList() {
      const res = await adminFetch('/api/admin/seller-blacklist');
      if (res.status === 401) { adminHandleUnauthorized(document.getElementById('content')); return; }
      const data = await res.json();
      const sellers = data.sellers || [];
      const rows = sellers.length
        ? sellers.map(s => `
            <tr>
              <td><strong>${escHtml(s.username)}</strong></td>
              <td style="color:#888">${s.added_at ? s.added_at.slice(0, 10) : ''}</td>
              <td><button class="admin-btn admin-btn-remove" data-username="${escHtml(s.username)}">Remove</button></td>
            </tr>`).join('')
        : '<tr><td colspan="3" class="admin-empty">No sellers blacklisted yet.</td></tr>';
      document.getElementById('blBody').innerHTML = rows;
    }

    async function loadPage() {
      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="admin-card">
          <h2>Add Seller</h2>
          <div class="add-row">
            <input type="text" id="usernameInput" placeholder="PBT username (e.g. happypuppies)" autocomplete="off" />
            <button class="admin-btn admin-btn-primary" id="addBtn">Add</button>
          </div>
          <div id="addMsg"></div>
        </div>
        <div class="admin-card">
          <h2>Current Blacklist</h2>
          <table class="admin-table">
            <thead><tr><th>Username</th><th>Added</th><th></th></tr></thead>
            <tbody id="blBody"><tr><td colspan="3" class="admin-empty">Loading…</td></tr></tbody>
          </table>
        </div>
      `;
      document.getElementById('addBtn').addEventListener('click', addSeller);
      document.getElementById('usernameInput').addEventListener('keydown', e => { if (e.key === 'Enter') addSeller(); });
      document.getElementById('blBody').addEventListener('click', (e) => {
        const btn = e.target.closest('.admin-btn-remove');
        if (btn) removeSeller(btn.dataset.username);
      });
      try {
        await renderList();
      } catch {
        document.getElementById('blBody').innerHTML = '<tr><td colspan="3" class="admin-empty">Failed to load.</td></tr>';
      }
    }

    adminTokenGate(document.getElementById('content'), loadPage);
  </script>
</body>
</html>
